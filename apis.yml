aid: advancedsolarpower
name: Advanced Solar Power
description: >-
  Advanced Solar Power (Hangzhou) Inc. is a Chinese photovoltaic manufacturer founded in 2008 that
  researches, produces and sells cadmium telluride (CdTe) thin-film solar modules, photovoltaic
  system engineering, and building-integrated photovoltaic (BIPV) application products. It was the
  first CdTe thin-film module manufacturer in China, is led by former CdTe conversion-efficiency
  world-record holder Professor Xuanzhi Wu, and has developed its own deposition equipment and
  process technology. Its S1, S2 and S4 standard modules and BIPV lines (photovoltaic floor tiles,
  imitation-aluminum and imitation-marble facade modules, shaped and insulated modules) carry ISO,
  TUV, CE, UL, CQC, Australia CEC and California CEC certifications, and have been deployed on the
  China Pavilion of the 2019 Beijing Horticultural Expo and other landmark facade and rooftop
  projects. The company sells physical hardware and system integration; it publishes no developer
  program, API, or machine-readable interface of any kind.
